<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Smart Agriculture AI — IoT & Crop Intelligence{% endblock %}</title>
  
  <!-- Modern Typography: Outfit (headings & numbers) + Plus Jakarta Sans (body UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  
  <!-- Font Awesome 6.5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  
  <!-- Chart.js 4.4 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    /* CSS Reset & Design Tokens */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; scroll-behavior: smooth; }
    
    :root {
      /* Dark Theme (Default) */
      --bg: #090d16;
      --bg-gradient: radial-gradient(circle at 15% 10%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                     radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.07) 0%, transparent 45%),
                     #090d16;
      --surface: #0f172a;
      --surface-card: rgba(18, 26, 44, 0.75);
      --surface-elevated: #162035;
      --surface-alt: #1e293b;
      --surface-hover: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --border-soft: rgba(255, 255, 255, 0.04);
      --border-accent: rgba(16, 185, 129, 0.3);
      
      --text: #f8fafc;
      --text-2: #94a3b8;
      --text-3: #64748b;
      
      --primary: #10b981;
      --primary-light: rgba(16, 185, 129, 0.15);
      --primary-hover: #059669;
      --primary-glow: rgba(16, 185, 129, 0.35);
      
      --cyan: #06b6d4;
      --cyan-light: rgba(6, 182, 212, 0.15);
      --blue: #3b82f6;
      --blue-light: rgba(59, 130, 246, 0.15);
      --amber: #f59e0b;
      --amber-light: rgba(245, 158, 11, 0.15);
      --red: #ef4444;
      --red-light: rgba(239, 68, 68, 0.15);
      --purple: #a855f7;
      --purple-light: rgba(168, 85, 247, 0.15);
      
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
      --glass-blur: blur(16px);
      
      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --bg-gradient: radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
                     radial-gradient(circle at 90% 85%, rgba(6, 182, 212, 0.05) 0%, transparent 45%),
                     #f8fafc;
      --surface: #ffffff;
      --surface-card: rgba(255, 255, 255, 0.85);
      --surface-elevated: #f1f5f9;
      --surface-alt: #f8fafc;
      --surface-hover: rgba(0, 0, 0, 0.02);
      --border: #e2e8f0;
      --border-soft: #f1f5f9;
      --border-accent: rgba(16, 185, 129, 0.4);
      
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      
      --primary: #059669;
      --primary-light: #ecfdf5;
      --primary-hover: #047857;
      --primary-glow: rgba(5, 150, 105, 0.2);
      
      --cyan: #0284c7;
      --cyan-light: #f0f9ff;
      --blue: #2563eb;
      --blue-light: #eff6ff;
      --amber: #d97706;
      --amber-light: #fffbeb;
      --red: #dc2626;
      --red-light: #fef2f2;
      --purple: #7c3aed;
      --purple-light: #faf5ff;
      
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 10px 25px rgba(0,0,0,0.06), 0 4px 10px rgba(0,0,0,0.03);
      --shadow-lg: 0 20px 35px rgba(0,0,0,0.09);
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3, h4, h5, h6, .brand-name, .metric-value, .stat-value {
      font-family: 'Outfit', sans-serif;
      letter-spacing: -0.02em;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; }
    input, select, textarea { font-family: inherit; }

    /* Modern Top Navigation Bar */
    .topnav {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: all 0.25s ease;
    }
    [data-theme="light"] .topnav {
      background: rgba(255, 255, 255, 0.85);
    }

    .topnav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.15rem;
      box-shadow: 0 4px 14px var(--primary-glow);
      transition: transform 0.2s ease;
    }
    .brand-icon-box:hover {
      transform: scale(1.06) rotate(3deg);
    }
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    .brand-name {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-tag {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--primary);
    }

    /* Status Pill */
    .iot-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--border-accent);
      margin-left: 12px;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 0 var(--primary-glow);
      animation: pulseAnimation 2s infinite;
    }
    @keyframes pulseAnimation {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Nav Links */
    .topnav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.15);
      padding: 4px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
    }
    [data-theme="light"] .topnav-links {
      background: rgba(0, 0, 0, 0.04);
    }
    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      border-radius: var(--radius-full);
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-2);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-pill:hover {
      color: var(--text);
      background: var(--surface-hover);
    }
    .nav-pill.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 3px 12px var(--primary-glow);
    }

    .topnav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--primary-glow);
    }
    .btn-secondary {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
    }
    .btn-secondary:hover {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      transform: translateY(-1px);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover {
      background: var(--surface-elevated);
      border-color: var(--text-3);
    }
    .btn-danger {
      background: var(--red);
      color: #fff;
    }
    .btn-danger:hover {
      background: #dc2626;
    }
    .btn-sm { padding: 6px 14px; font-size: 0.78rem; border-radius: 6px; }
    .btn-icon {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 0.95rem;
    }
    .btn-icon:hover {
      color: var(--text);
      background: var(--surface-elevated);
      border-color: var(--border-accent);
    }

    /* Cards & Containers */
    .card {
      background: var(--surface-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      overflow: hidden;
    }
    .card:hover {
      border-color: rgba(16, 185, 129, 0.25);
    }
    .card-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-body { padding: 22px 24px; }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .badge-green { background: var(--primary-light); color: var(--primary); border: 1px solid var(--border-accent); }
    .badge-cyan  { background: var(--cyan-light); color: var(--cyan); }
    .badge-blue  { background: var(--blue-light); color: var(--blue); }
    .badge-amber { background: var(--amber-light); color: var(--amber); }
    .badge-red   { background: var(--red-light); color: var(--red); }
    .badge-slate { background: var(--surface-alt); color: var(--text-2); border: 1px solid var(--border); }
    .badge-purple{ background: var(--purple-light); color: var(--purple); }

    /* Forms */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      color: var(--text);
      background: var(--surface);
      transition: all 0.2s ease;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    .form-textarea { resize: vertical; min-height: 90px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open {
      display: flex;
      opacity: 1;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      overflow-y: auto;
      transform: scale(0.96);
      transition: transform 0.2s ease;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-header {
      padding: 22px 28px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { font-size: 1.15rem; font-weight: 700; color: var(--text); }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-3);
      font-size: 1.25rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .modal-close:hover { background: var(--surface-alt); color: var(--text); }
    .modal-body { padding: 24px 28px; }
    .modal-footer {
      padding: 18px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      background: var(--surface-alt);
    }

    /* Toasts */
    #toast-wrap {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: var(--surface-elevated);
      color: var(--text);
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.ok { border-left: 4px solid var(--primary); }
    .toast.err { border-left: 4px solid var(--red); }
    .toast.warn { border-left: 4px solid var(--amber); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Global Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 99px; }
    [data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.18); }

    /* Responsive */
    @media (max-width: 840px) {
      .topnav { padding: 0 16px; }
      .iot-status-pill { display: none; }
      .nav-pill span.link-text { display: none; }
      .nav-pill { padding: 8px 12px; }
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Top Navigation Header -->
  <nav class="topnav">
    <div class="topnav-brand">
      <a href="/" class="topnav-brand">
        <div class="brand-icon-box">
          <i class="fa-solid fa-seedling"></i>
        </div>
        <div class="brand-text">
          <div class="brand-name">
            SmartAgri <span style="color:var(--primary);font-weight:800">AI</span>
          </div>
          <div class="brand-tag">IoT & Crop Health Lab</div>
        </div>
      </a>
      <div class="iot-status-pill">
        <span class="pulse-dot"></span>
        <span>Telemetry Stream Active</span>
      </div>
    </div>

    <!-- Center Navigation Pills -->
    <div class="topnav-links">
      <a href="/" class="nav-pill {% block nav_home %}{% endblock %}">
        <i class="fa-solid fa-wheat-awn"></i>
        <span class="link-text">My Crops</span>
      </a>
      <a href="/disease/" class="nav-pill {% block nav_disease %}{% endblock %}">
        <i class="fa-solid fa-microscope"></i>
        <span class="link-text">Disease Lab</span>
      </a>
    </div>

    <!-- Right Controls -->
    <div class="topnav-actions">
      <!-- Theme Switcher -->
      <button class="btn-icon" id="theme-toggle-btn" title="Toggle Light/Dark Theme" onclick="toggleTheme()">
        <i class="fa-solid fa-sun" id="theme-icon"></i>
      </button>

      {% block topnav_right %}
      <button class="btn btn-primary" onclick="openModal('new-session-modal')">
        <i class="fa-solid fa-plus"></i>
        <span>New Crop</span>
      </button>
      {% endblock %}
    </div>
  </nav>

  <!-- Page Content -->
  {% block content %}{% endblock %}

  <!-- Toast Notification Wrapper -->
  <div id="toast-wrap"></div>

  <script>
    // Theme Management
    function initTheme() {
      const saved = localStorage.getItem('agro_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      updateThemeIcon(saved);
    }
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('agro_theme', next);
      updateThemeIcon(next);
      if (typeof Chart !== 'undefined' && Chart.instances) {
        Object.values(Chart.instances).forEach(c => c.update());
      }
    }
    function updateThemeIcon(theme) {
      const icon = document.getElementById('theme-icon');
      if (!icon) return;
      if (theme === 'dark') {
        icon.className = 'fa-solid fa-sun';
      } else {
        icon.className = 'fa-solid fa-moon';
      }
    }
    initTheme();

    // Notification Helper
    function toast(msg, type = 'ok') {
      const wrap = document.getElementById('toast-wrap');
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      let icon = 'fa-circle-check';
      if (type === 'err') icon = 'fa-triangle-exclamation';
      if (type === 'warn') icon = 'fa-circle-exclamation';
      el.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${msg}</span>`;
      wrap.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        el.style.transition = 'all 0.3s ease';
        setTimeout(() => el.remove(), 300);
      }, 3500);
    }

    // Modal Control
    function openModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('open');
    }
    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove('open');
    }

    // Chart.js Theme Defaults
    if (typeof Chart !== 'undefined') {
      Chart.defaults.font.family = "'Plus Jakarta Sans', system-ui, sans-serif";
      Chart.defaults.font.size = 11;
      Chart.defaults.color = '#94a3b8';
    }
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
