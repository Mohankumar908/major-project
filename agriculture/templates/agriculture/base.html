<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>{% block title %}Smart Agriculture{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ── Reset ── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:14px;scroll-behavior:smooth}
    body{font-family:'Inter',system-ui,sans-serif;background:#f0f2f5;color:#1a1f2e;min-height:100vh}
    a{text-decoration:none;color:inherit}
    img{display:block;max-width:100%}
    button{font-family:inherit;cursor:pointer}
    input,select,textarea{font-family:inherit}

    /* ── Tokens ── */
    :root{
      --green:        #1e7a42;
      --green-mid:    #2d9e57;
      --green-light:  #e6f4ec;
      --green-pale:   #f2fbf5;
      --blue:         #2563eb;
      --blue-light:   #eff6ff;
      --amber:        #d97706;
      --amber-light:  #fffbeb;
      --red:          #dc2626;
      --red-light:    #fef2f2;
      --teal:         #0d9488;
      --teal-light:   #f0fdfa;
      --purple:       #7c3aed;
      --purple-light: #f5f3ff;
      --slate:        #64748b;
      --border:       #e2e8f0;
      --border-soft:  #f1f5f9;
      --surface:      #ffffff;
      --surface-alt:  #f8fafc;
      --text:         #0f172a;
      --text-2:       #475569;
      --text-3:       #94a3b8;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
      --shadow:       0 4px 6px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.04);
      --shadow-md:    0 10px 20px rgba(0,0,0,.08),0 4px 6px rgba(0,0,0,.04);
      --r:            10px;
      --r-sm:         6px;
      --r-lg:         14px;
    }

    /* ── Topnav ── */
    .topnav{
      background:var(--surface);border-bottom:1px solid var(--border);
      height:58px;padding:0 28px;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);
    }
    .topnav-brand{display:flex;align-items:center;gap:10px}
    .brand-logo{
      width:34px;height:34px;border-radius:8px;
      background:linear-gradient(135deg,#1e7a42,#2d9e57);
      display:flex;align-items:center;justify-content:center;font-size:17px;
    }
    .brand-name{font-size:1rem;font-weight:700;color:var(--text);letter-spacing:-.3px}
    .brand-tagline{font-size:.68rem;color:var(--text-3);margin-top:1px}
    .topnav-links{display:flex;align-items:center;gap:4px}
    .nav-link{
      padding:6px 14px;border-radius:var(--r-sm);font-size:.82rem;font-weight:500;
      color:var(--text-2);transition:all .15s;
    }
    .nav-link:hover{background:var(--surface-alt);color:var(--text)}
    .nav-link.active{background:var(--green-light);color:var(--green);font-weight:600}
    .topnav-right{display:flex;align-items:center;gap:10px}

    /* ── Buttons ── */
    .btn{
      display:inline-flex;align-items:center;gap:6px;
      padding:7px 16px;border-radius:var(--r-sm);
      font-size:.82rem;font-weight:500;border:none;transition:all .15s;
    }
    .btn-primary{background:var(--green);color:#fff}
    .btn-primary:hover{background:#195f34}
    .btn-secondary{background:var(--blue);color:#fff}
    .btn-secondary:hover{background:#1d4ed8}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-2)}
    .btn-outline:hover{background:var(--surface-alt)}
    .btn-danger{background:var(--red);color:#fff}
    .btn-danger:hover{background:#b91c1c}
    .btn-sm{padding:5px 11px;font-size:.76rem}
    .btn-lg{padding:10px 22px;font-size:.9rem}

    /* ── Cards ── */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm)}
    .card-header{
      padding:15px 20px 12px;border-bottom:1px solid var(--border-soft);
      display:flex;align-items:center;justify-content:space-between;
    }
    .card-title{font-size:.88rem;font-weight:600;color:var(--text);display:flex;align-items:center;gap:7px}
    .card-body{padding:18px 20px}

    /* ── Badges ── */
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:600}
    .badge-green  {background:var(--green-light);color:var(--green)}
    .badge-blue   {background:var(--blue-light);color:var(--blue)}
    .badge-amber  {background:var(--amber-light);color:var(--amber)}
    .badge-red    {background:var(--red-light);color:var(--red)}
    .badge-slate  {background:#f1f5f9;color:var(--slate)}
    .badge-purple {background:var(--purple-light);color:var(--purple)}

    /* ── Forms ── */
    .form-group{margin-bottom:14px}
    .form-label{display:block;font-size:.78rem;font-weight:500;color:var(--text-2);margin-bottom:5px}
    .form-input,.form-select,.form-textarea{
      width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r-sm);
      font-size:.84rem;color:var(--text);background:var(--surface);transition:border-color .15s;
    }
    .form-input:focus,.form-select:focus,.form-textarea:focus{
      outline:none;border-color:var(--green-mid);box-shadow:0 0 0 3px rgba(45,158,87,.1);
    }
    .form-textarea{resize:vertical;min-height:80px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

    /* ── Modal ── */
    .modal-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);
      z-index:200;display:none;align-items:center;justify-content:center;padding:20px;
    }
    .modal-overlay.open{display:flex}
    .modal{
      background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-md);
      width:100%;max-width:500px;max-height:90vh;overflow-y:auto;
    }
    .modal-header{
      padding:20px 24px 16px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;
    }
    .modal-header h3{font-size:1rem;font-weight:700}
    .modal-close{background:none;border:none;font-size:1.3rem;color:var(--text-3);cursor:pointer;padding:2px 6px;border-radius:4px}
    .modal-close:hover{background:var(--surface-alt);color:var(--text)}
    .modal-body{padding:20px 24px}
    .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

    /* ── Upload zone ── */
    .upload-zone{
      border:2px dashed var(--border);border-radius:var(--r);padding:28px 20px;
      text-align:center;cursor:pointer;background:var(--surface-alt);transition:all .2s;
    }
    .upload-zone:hover,.upload-zone.drag{border-color:var(--green-mid);background:var(--green-pale)}
    .upload-zone-icon{font-size:2rem;margin-bottom:8px}
    .upload-zone-text{font-size:.85rem;font-weight:500;color:var(--text-2)}
    .upload-zone-hint{font-size:.73rem;color:var(--text-3);margin-top:3px}
    input[type=file]{display:none}

    /* ── Progress bar ── */
    .progress-track{background:var(--border);border-radius:4px;height:6px;overflow:hidden}
    .progress-fill{height:100%;border-radius:4px;transition:width .6s ease}

    /* ── Divider ── */
    .divider{height:1px;background:var(--border);margin:16px 0}

    /* ── Spinner ── */
    .spinner{
      display:inline-block;width:16px;height:16px;
      border:2px solid var(--border);border-top-color:var(--green-mid);
      border-radius:50%;animation:spin .7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Live dot ── */
    .live-dot{
      display:inline-block;width:7px;height:7px;
      background:var(--green-mid);border-radius:50%;animation:pulse 2s infinite;
    }
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.3)}}

    /* ── Toast ── */
    #toast-wrap{position:fixed;bottom:22px;right:22px;z-index:500;display:flex;flex-direction:column;gap:8px}
    .toast{
      background:#1e293b;color:#fff;padding:10px 16px;border-radius:var(--r-sm);
      font-size:.8rem;font-weight:500;box-shadow:var(--shadow-md);animation:slideUp .2s ease;
    }
    .toast.ok  {background:var(--green)}
    .toast.err {background:var(--red)}
    .toast.warn{background:var(--amber)}
    @keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    /* ── Scrollbar ── */
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}

    /* ── Responsive ── */
    @media(max-width:768px){
      .topnav{padding:0 16px}
      .form-row,.form-row-3{grid-template-columns:1fr}
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="topnav">
  <a href="/" class="topnav-brand">
    <div class="brand-logo">🌱</div>
    <div>
      <div class="brand-name">Smart Agriculture</div>
      <div class="brand-tagline">Plant Growth Monitoring</div>
    </div>
  </a>
  <div class="topnav-links">
    <a href="/"         class="nav-link {% block nav_home %}{% endblock %}">🏠 My Crops</a>
    <a href="/disease/" class="nav-link {% block nav_disease %}{% endblock %}">🔬 Disease Detection</a>
  </div>
  <div class="topnav-right">
    {% block topnav_right %}{% endblock %}
  </div>
</nav>

{% block content %}{% endblock %}

<div id="toast-wrap"></div>

<script>
function toast(msg, type=''){
  const c=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className='toast '+type;el.textContent=msg;
  c.appendChild(el);setTimeout(()=>el.remove(),3500);
}
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function setupDrop(zoneId,inputId,previewFn){
  const z=document.getElementById(zoneId);if(!z)return;
  z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('drag')});
  z.addEventListener('dragleave',()=>z.classList.remove('drag'));
  z.addEventListener('drop',e=>{
    e.preventDefault();z.classList.remove('drag');
    const inp=document.getElementById(inputId);
    if(e.dataTransfer.files.length){
      const dt=new DataTransfer();
      Array.from(e.dataTransfer.files).forEach(f=>dt.items.add(f));
      inp.files=dt.files;if(previewFn)previewFn(inp);
    }
  });
}
Chart.defaults.font.family="'Inter',system-ui,sans-serif";
Chart.defaults.font.size=11;
Chart.defaults.color='#64748b';
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
